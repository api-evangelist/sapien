aid: sapien
name: Sapien
description: >-
  Sapien is the company behind Proof of Quality (PoQ), an open protocol and consensus/attestation
  system for verifiable quality signals on AI data and subjective expert outputs. A panel of
  independent, collateral-backed validators reviews each item against a customer-defined rubric
  (a poq.toml spec), consensus collapses their scores into one rating per datapoint, and the result
  is sealed as a permanent onchain attestation (a PoQ Report) — while the underlying data never
  leaves the customer's systems. Use cases span training-data labeling, fine-tuning and evaluation
  gates, audit/compliance review, and production safety verification. Sapien ships a live Developer
  API (/developer/v1) and an MCP server, both authenticated with poq_live_ API keys, and runs on
  Base Mainnet with a $SAPIEN staking/slashing token. Backed by General Catalyst.
